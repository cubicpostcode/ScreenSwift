name: Release ScreenSwift

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Publish ScreenSwift
        shell: powershell
        run: dotnet publish .\ScreenSwift\ScreenSwift.csproj -c Release -r win-x64 --self-contained true

      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\Installer\ScreenSwift.iss'

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag ".\Installer\Output\ScreenSwift-Setup.exe" --clobber
          } else {
            gh release create $tag ".\Installer\Output\ScreenSwift-Setup.exe" --title "ScreenSwift $tag" --generate-notes
          }
